# Caps the system journal at 500 MB (it had grown to ~4 GB on one node).
# Install:  mkdir -p /etc/systemd/journald.conf.d && cp journald-size.conf /etc/systemd/journald.conf.d/size.conf
#           systemctl restart systemd-journald && journalctl --rotate && journalctl --vacuum-size=500M
[Journal]
SystemMaxUse=500M
